name: Auto PR to main

on:
  push:
    branches-ignore: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if gh pr view "$BRANCH" --json id --jq '.id' &>/dev/null; then
            echo "PR already exists for $BRANCH"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Merge $BRANCH → main" \
              --body "Automated PR created by CI when pushing to \`$BRANCH\`." \
              --label automated
          fi
